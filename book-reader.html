<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport"><meta content="noindex" name="robots"><title>PROJECT 100 · Book reader</title><link href="assets/vendor/pdfjs/pdf_viewer.css" rel="stylesheet"><link href="assets/css/book-reader.css?v=75d2e74f7512" rel="stylesheet"></head>
<body><header class="reader-head"><div><span>PROJECT 100 / READ ONLINE</span><h1 id="readerTitle">Opening book…</h1></div><button id="closeReader" type="button">Close ×</button></header>
<nav aria-label="PDF controls" class="reader-tools"><button aria-label="Previous page" id="previousPage" type="button">←</button><label>Page <input aria-label="Page number" id="pageNumber" inputmode="numeric" min="1" type="number" value="1"> <span id="pageCount">/ …</span></label><button aria-label="Next page" id="nextPage" type="button">→</button><button aria-label="Zoom out" id="zoomOut" type="button">−</button><button aria-label="Zoom in" id="zoomIn" type="button">+</button><button id="fitPage" type="button">Fit</button></nav>
<main class="reader-canvas"><img alt="Document first page" hidden="" id="readerPreview"><div aria-label="PDF pages" id="pdfArea" tabindex="0"><div class="pdfViewer" id="pdfPages"></div></div></main><p id="readerStatus" role="status">Loading PDF…</p>
<footer class="reader-download"><a download="" id="downloadBook">Download full PDF ↓</a></footer><script src="assets/js/book-reader.js?v=9d962f4435ad" type="module"></script></body></html>
