name: Check current website against publication corrections
on:
  push:
    branches: [main]
    paths: ['*.html', 'assets/css/**', 'assets/js/site.js', 'assets/data/**', 'assets/js/salad-cards.js', 'assets/js/meal-stories.js', 'assets/js/item-purpose.js', 'assets/downloads/project-100-*.pdf', 'downloads/reference/project100-analysis-data.json', 'scripts/check-*book*', 'scripts/check-publication-consistency.py', 'scripts/check-source-architecture.py', 'scripts/check-silent-media.py', 'assets/**/*.mp4', 'assets/**/*.webm', 'assets/**/*.mov', 'assets/**/*.m4v', 'assets/**/*.mp3', 'assets/**/*.m4a', 'assets/**/*.wav', 'assets/**/*.ogg', 'assets/**/*.aac', 'assets/**/*.opus', '.github/workflows/publication-consistency.yml']
  pull_request:
    paths: ['*.html', 'assets/css/**', 'assets/js/site.js', 'assets/data/**', 'assets/js/salad-cards.js', 'assets/js/meal-stories.js', 'assets/js/item-purpose.js', 'assets/downloads/project-100-*.pdf', 'downloads/reference/project100-analysis-data.json', 'scripts/check-*book*', 'scripts/check-publication-consistency.py', 'scripts/check-source-architecture.py', 'scripts/check-silent-media.py', 'assets/**/*.mp4', 'assets/**/*.webm', 'assets/**/*.mov', 'assets/**/*.m4v', 'assets/**/*.mp3', 'assets/**/*.m4a', 'assets/**/*.wav', 'assets/**/*.ogg', 'assets/**/*.aac', 'assets/**/*.opus', '.github/workflows/publication-consistency.yml']
permissions:
  contents: read
jobs:
  source-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install pypdf
      - run: python scripts/check-publication-consistency.py
      - run: node scripts/check-nutrition-book-models.cjs
      - run: python scripts/check-workout-source.py
      - run: python scripts/check-silent-media.py
