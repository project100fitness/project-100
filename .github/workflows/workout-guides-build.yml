name: Build and validate integrated Kinetics guides
on:
  push:
    branches: [main]
    paths:
      - 'assets/js/training-state.js'
      - 'assets/js/p100-band-training.js'
      - 'assets/js/workout-guides.js'
      - 'assets/media/workout-guides/**'
      - 'downloads/kinetics/training-plan-v0.3.json'
      - 'downloads/kinetics/image-metadata.json'
      - 'scripts/build-workout-guides.cjs'
      - 'scripts/validate-workout-guides.py'
      - '.github/workflows/workout-guides-build.yml'
  pull_request:
    paths: ['kinetics.html', 'assets/js/*training*.js', 'assets/js/workout-guides.js', 'downloads/kinetics/**']
permissions:
  contents: write
concurrency:
  group: kinetics-guides-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pypdf
      - name: Check training scripts
        run: |
          node --check assets/js/training-state.js
          node --check assets/js/p100-band-training.js
          node --check assets/js/kinetics-showcase.js
          node --check assets/js/workout-guides.js
          node scripts/check-download-drawer.cjs
      - name: Build the complete illustrated edition
        run: node scripts/build-workout-guides.cjs
      - name: Validate all guides, equipment and links
        run: python scripts/validate-workout-guides.py
      - name: Publish verified PDF downloads to the site branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/kinetics/pdf downloads/kinetics/pdf-build-report.json docs/workout-guides/integrated-validation.json
          if ! git diff --cached --quiet; then
            git commit -m "Build verified expanded Kinetics guide downloads"
            git push
          fi
