name: Materialize verified publication upload
on:
  push:
    branches: [manual-library-2026-10-25]
    paths: ['.release-staging/materialize.json']
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: manual-library-2026-10-25
          filter: blob:none
          sparse-checkout: |
            assets/downloads
            .release-staging
            .github/workflows
      - name: Reassemble the unchanged supplied PDF and verify every byte
        shell: python
        run: |
          from pathlib import Path
          import json,hashlib
          root=Path.cwd(); stage=root/'.release-staging'
          manifest=json.loads((stage/'materialize.json').read_text())
          chunks=[]
          for part in manifest['parts']:
              path=(root/part['path']).resolve()
              assert path.parent==stage.resolve()
              data=path.read_bytes()
              assert len(data)==part['bytes'] and hashlib.sha256(data).hexdigest()==part['sha256']
              chunks.append(data)
          pdf=b''.join(chunks)
          assert len(pdf)==manifest['bytes'] and hashlib.sha256(pdf).hexdigest()==manifest['sha256']
          assert hashlib.sha1(b'blob '+str(len(pdf)).encode()+b'\0'+pdf).hexdigest()==manifest['gitBlob']
          for name in manifest['targets']:
              path=(root/name).resolve()
              assert path.parent==(root/'assets/downloads').resolve() and path.suffix=='.pdf'
              path.write_bytes(pdf)
          for path in stage.iterdir():
              assert path.is_file()
              path.unlink()
          stage.rmdir()
          (root/'.github/workflows/materialize-publications.yml').unlink()
      - name: Commit the verified original and remove temporary upload files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- assets/downloads .release-staging .github/workflows/materialize-publications.yml
          git commit -m 'Materialize verified original Encyclopedia V3.6 PDF'
          git push origin HEAD:manual-library-2026-10-25

