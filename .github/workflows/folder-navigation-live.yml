name: Verify deployed folder design
on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'assets/css/site.css'
      - 'assets/css/hud.css'
      - 'assets/css/mobile-rail.css'
      - 'assets/css/kinetics.css'
      - 'assets/js/site.js'
      - 'scripts/check-folder-navigation-live.py'
      - '.github/workflows/folder-navigation-live.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            assets/css
            assets/js
            scripts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check-folder-navigation-live.py
      - uses: actions/upload-artifact@v4
        with:
          name: deployed-folder-design-validation
          path: docs/folder-navigation/live-validation.json
