<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1248" viewBox="0 0 1200 1248" role="img" aria-label="V2 REFUEL ingredients and protocol"><rect width="1200" height="1248" fill="#f6f2e9"/><rect width="1200" height="128" fill="#50d7f0"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="64" y="46" font-size="16" fill="#242424">PROJECT 100 / DESCRIPTIVE VECTOR RECORD / V2.0</text><text x="64" y="96" font-size="36" font-weight="700" fill="#151515">V2 REFUEL</text><text x="64" y="188" font-size="18" font-weight="700" fill="#534b42">BASE</text><text x="64" y="222" font-size="22" fill="#242424">600-750 mL cold filtered water</text><text x="64" y="284" font-size="18" font-weight="700" fill="#534b42">INGREDIENTS</text><text x="64" y="318" font-size="22" fill="#242424">Perfect Sports BCAA HyperClear (1 scoop / 7.5 g BCAAs 2:1:1); RapiDrem Electrolyte</text><text x="64" y="350" font-size="22" fill="#242424">Powder (1 scoop, about 6.5 g); Kirkland Himalayan Pink Salt 1/16 tsp; 2-3 Medjool dates</text><text x="64" y="382" font-size="22" fill="#242424">chewed solid, separately</text><text x="64" y="444" font-size="18" font-weight="700" fill="#534b42">PROTOCOL</text><text x="64" y="478" font-size="22" fill="#242424">09:30 intra- workout; training only</text><text x="64" y="540" font-size="18" font-weight="700" fill="#534b42">MECHANISM</text><text x="64" y="574" font-size="22" fill="#242424">3,750 mg leucine-led BCAAs, 1,000 mg potassium, 100 mg magnesium, about 36-54 g fast</text><text x="64" y="606" font-size="22" fill="#242424">carbohydrate from dates.</text><text x="64" y="668" font-size="18" font-weight="700" fill="#534b42">STACK INTERACTION</text><text x="64" y="702" font-size="22" fill="#242424">Magnesium 341-646 mg + high- dose vitamin C + continuous bile trickle — Loose stools are</text><text x="64" y="734" font-size="22" fill="#242424">predictable system output; log and moderate fat bolus before blaming single foods.</text><text x="64" y="796" font-size="18" font-weight="700" fill="#534b42">MARGIN</text><text x="64" y="830" font-size="22" fill="#242424">Supplemental magnesium: training baseline 341 mg; up to 646 mg with options, versus 350</text><text x="64" y="862" font-size="22" fill="#242424">mg/day supplemental UL. Rest totals are lower and not fully quantified.</text><text x="64" y="924" font-size="18" font-weight="700" fill="#534b42">MONITOR</text><text x="64" y="958" font-size="22" fill="#242424">Stool, pain, weakness, sleep and performance noted; options marked as taken or skipped.</text><text x="64" y="1020" font-size="18" font-weight="700" fill="#534b42">STOP RULE</text><text x="64" y="1054" font-size="22" fill="#242424">Recurrent watery stools with weight loss, oily stools or significant abdominal pain:</text><text x="64" y="1086" font-size="22" fill="#242424">stop and seek assessment.</text><text x="64" y="1168" font-size="16" fill="#534b42">Personal system record. Read the source before adopting a protocol.</text><text x="64" y="1196" font-size="16" fill="#534b42">project100.fit/guidebook.html#vector-v2</text></g></svg>