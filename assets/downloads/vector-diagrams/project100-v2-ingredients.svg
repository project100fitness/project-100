<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1414" viewBox="0 0 1200 1414" role="img" aria-label="V2 REFUEL descriptive record"><rect width="1200" height="1414" fill="#f6f2e9"/><rect width="1200" height="128" fill="#ec6278"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="64" y="46" font-size="16">PROJECT 100 / DESCRIPTIVE VECTOR RECORD / 5 OCTOBER 2026</text><text x="64" y="96" font-size="36" font-weight="700">V2 REFUEL</text><text x="64" y="180" font-size="18" font-weight="700" fill="#534b42">DEPLOYMENT</text><text x="64" y="214" font-size="22" fill="#242424">During the training session (States A and C)</text><text x="64" y="274" font-size="18" font-weight="700" fill="#534b42">BASE</text><text x="64" y="308" font-size="22" fill="#242424">600-750 mL cold filtered water</text><text x="64" y="368" font-size="18" font-weight="700" fill="#534b42">INGREDIENTS</text><text x="64" y="402" font-size="22" fill="#242424">Perfect Sports BCAA HyperClear (1 scoop / 7.5 g BCAAs 2:1:1); RapiDrem Electrolyte</text><text x="64" y="434" font-size="22" fill="#242424">Powder (1 scoop, about 6.5 g); Kirkland Himalayan Pink Salt 1/16 tsp; 2-3 Medjool</text><text x="64" y="466" font-size="22" fill="#242424">dates chewed solid, separately</text><text x="64" y="526" font-size="18" font-weight="700" fill="#534b42">PROTOCOL</text><text x="64" y="560" font-size="22" fill="#242424">During the training session (09:30 morning reference); moves with the evening</text><text x="64" y="592" font-size="22" fill="#242424">workout in State C.</text><text x="64" y="652" font-size="18" font-weight="700" fill="#534b42">MECHANISM</text><text x="64" y="686" font-size="22" fill="#242424">3,750 mg leucine-led BCAAs, 1,000 mg potassium, 100 mg magnesium, about 36-54 g fast</text><text x="64" y="718" font-size="22" fill="#242424">carbohydrate from dates.</text><text x="64" y="778" font-size="18" font-weight="700" fill="#534b42">STACK INTERACTION</text><text x="64" y="812" font-size="22" fill="#242424">Magnesium 341-646 mg + high- dose vitamin C + continuous bile trickle — Loose stools</text><text x="64" y="844" font-size="22" fill="#242424">are predictable system output; log and moderate fat bolus before blaming single</text><text x="64" y="876" font-size="22" fill="#242424">foods.</text><text x="64" y="936" font-size="18" font-weight="700" fill="#534b42">MARGIN</text><text x="64" y="970" font-size="22" fill="#242424">Supplemental magnesium: training baseline 341 mg; up to 646 mg with options, versus</text><text x="64" y="1002" font-size="22" fill="#242424">350 mg/day supplemental UL. Rest totals are lower and not fully quantified.</text><text x="64" y="1062" font-size="18" font-weight="700" fill="#534b42">MONITOR</text><text x="64" y="1096" font-size="22" fill="#242424">Stool, pain, weakness, sleep and performance noted; options marked as taken or</text><text x="64" y="1128" font-size="22" fill="#242424">skipped.</text><text x="64" y="1188" font-size="18" font-weight="700" fill="#534b42">STOP RULE</text><text x="64" y="1222" font-size="22" fill="#242424">Recurrent watery stools with weight loss, oily stools or significant abdominal pain:</text><text x="64" y="1254" font-size="22" fill="#242424">stop and seek assessment.</text><text x="64" y="1334" font-size="16">Personal system record; not a safety guarantee or prescription.</text><text x="64" y="1362" font-size="16">project100.fit/fit-protocol-vector-v2.html</text></g></svg>