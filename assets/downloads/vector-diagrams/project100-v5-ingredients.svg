<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1382" viewBox="0 0 1200 1382" role="img" aria-label="V5 TRANSPORT descriptive record"><rect width="1200" height="1382" fill="#f6f2e9"/><rect width="1200" height="128" fill="#ec6278"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="64" y="46" font-size="16">PROJECT 100 / DESCRIPTIVE VECTOR RECORD / 5 OCTOBER 2026</text><text x="64" y="96" font-size="36" font-weight="700">V5 TRANSPORT</text><text x="64" y="180" font-size="18" font-weight="700" fill="#534b42">DEPLOYMENT</text><text x="64" y="214" font-size="22" fill="#242424">Rest days only (State B)</text><text x="64" y="274" font-size="18" font-weight="700" fill="#534b42">BASE</text><text x="64" y="308" font-size="22" fill="#242424">500 mL cold filtered water</text><text x="64" y="368" font-size="18" font-weight="700" fill="#534b42">INGREDIENTS</text><text x="64" y="402" font-size="22" fill="#242424">Proline Pure Creatine HCl 750 mg; PROMISE Pure Marine Collagen 10 g; ALLMAX Liquid</text><text x="64" y="434" font-size="22" fill="#242424">L-Carnitine 1500 (15 mL / 1,500 mg); RapiDrem Electrolyte Powder (1 scoop); Kirkland</text><text x="64" y="466" font-size="22" fill="#242424">Himalayan Salt 1/16 tsp</text><text x="64" y="526" font-size="18" font-weight="700" fill="#534b42">PROTOCOL</text><text x="64" y="560" font-size="22" fill="#242424">16:00-16:30; rest branch only</text><text x="64" y="620" font-size="18" font-weight="700" fill="#534b42">MECHANISM</text><text x="64" y="654" font-size="22" fill="#242424">Rest-day bridge: second daily creatine pulse (750 mg), 10 g connective-tissue</text><text x="64" y="686" font-size="22" fill="#242424">peptides, carnitine and electrolytes.</text><text x="64" y="746" font-size="18" font-weight="700" fill="#534b42">STACK INTERACTION</text><text x="64" y="780" font-size="22" fill="#242424">Magnesium 341-646 mg + high- dose vitamin C + continuous bile trickle — Loose stools</text><text x="64" y="812" font-size="22" fill="#242424">are predictable system output; log and moderate fat bolus before blaming single</text><text x="64" y="844" font-size="22" fill="#242424">foods.</text><text x="64" y="904" font-size="18" font-weight="700" fill="#534b42">MARGIN</text><text x="64" y="938" font-size="22" fill="#242424">Supplemental magnesium: training baseline 341 mg; up to 646 mg with options, versus</text><text x="64" y="970" font-size="22" fill="#242424">350 mg/day supplemental UL. Rest totals are lower and not fully quantified.</text><text x="64" y="1030" font-size="18" font-weight="700" fill="#534b42">MONITOR</text><text x="64" y="1064" font-size="22" fill="#242424">Stool, pain, weakness, sleep and performance noted; options marked as taken or</text><text x="64" y="1096" font-size="22" fill="#242424">skipped.</text><text x="64" y="1156" font-size="18" font-weight="700" fill="#534b42">STOP RULE</text><text x="64" y="1190" font-size="22" fill="#242424">Recurrent watery stools with weight loss, oily stools or significant abdominal pain:</text><text x="64" y="1222" font-size="22" fill="#242424">stop and seek assessment.</text><text x="64" y="1302" font-size="16">Personal system record; not a safety guarantee or prescription.</text><text x="64" y="1330" font-size="16">project100.fit/fit-protocol-vector-v5.html</text></g></svg>