<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1280" viewBox="0 0 1200 1280" role="img" aria-label="V1 IGNITION ingredients and protocol"><rect width="1200" height="1280" fill="#f6f2e9"/><rect width="1200" height="128" fill="#b7ed42"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="64" y="46" font-size="16" fill="#242424">PROJECT 100 / DESCRIPTIVE VECTOR RECORD / V2.0</text><text x="64" y="96" font-size="36" font-weight="700" fill="#151515">V1 IGNITION</text><text x="64" y="188" font-size="18" font-weight="700" fill="#534b42">BASE</text><text x="64" y="222" font-size="22" fill="#242424">500-600 mL cold filtered water</text><text x="64" y="284" font-size="18" font-weight="700" fill="#534b42">INGREDIENTS</text><text x="64" y="318" font-size="22" fill="#242424">ALLMAX Impact Igniter Xtreme 2.0 (2 scoops / 28 g); ALLMAX MuscleEAA Xtreme (1 scoop /</text><text x="64" y="350" font-size="22" fill="#242424">17.73 g); PeakO2 2,000 mg; Betaine Anhydrous 2,500 mg; Citrulline Malate 2:1 (4-6 g);</text><text x="64" y="382" font-size="22" fill="#242424">Pure Taurine Powder (2-3 g). Citicoline 250 mg capsule taken separately.</text><text x="64" y="444" font-size="18" font-weight="700" fill="#534b42">PROTOCOL</text><text x="64" y="478" font-size="22" fill="#242424">06:00 pre- gym; morning training only</text><text x="64" y="540" font-size="18" font-weight="700" fill="#534b42">MECHANISM</text><text x="64" y="574" font-size="22" fill="#242424">About 373 mg total caffeine, 10.67-12 g active citrulline base, 3.2 g beta-alanine, 2 g</text><text x="64" y="606" font-size="22" fill="#242424">PeakO2 mushrooms, 2.5 g betaine. Spaced about 2 hours post- breakfast tea.</text><text x="64" y="668" font-size="18" font-weight="700" fill="#534b42">STACK INTERACTION</text><text x="64" y="702" font-size="22" fill="#242424">IGNITER about 373 mg caffeine + TeaCrine (theacrine half-life 16-20 h) + Dynamine +</text><text x="64" y="734" font-size="22" fill="#242424">theobromine + Earl Grey 40-70 mg — Exposure regularly crosses the 400 mg/day guidance;</text><text x="64" y="766" font-size="22" fill="#242424">sleep is the limiting organ.</text><text x="64" y="828" font-size="18" font-weight="700" fill="#534b42">MARGIN</text><text x="64" y="862" font-size="22" fill="#242424">IGNITER about 373 mg caffeine before tea; with tea about 413–443 mg versus Health Canada</text><text x="64" y="894" font-size="22" fill="#242424">400 mg/day guidance.</text><text x="64" y="956" font-size="18" font-weight="700" fill="#534b42">MONITOR</text><text x="64" y="990" font-size="22" fill="#242424">Sleep duration and awakenings; session RPE and performance.</text><text x="64" y="1052" font-size="18" font-weight="700" fill="#534b42">STOP RULE</text><text x="64" y="1086" font-size="22" fill="#242424">Palpitations, fainting or sleep disruption that does not resolve when caffeine is pulled</text><text x="64" y="1118" font-size="22" fill="#242424">earlier.</text><text x="64" y="1200" font-size="16" fill="#534b42">Personal system record. Read the source before adopting a protocol.</text><text x="64" y="1228" font-size="16" fill="#534b42">project100.fit/guidebook.html#vector-v1</text></g></svg>