<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1350" viewBox="0 0 1200 1350" role="img" aria-label="V1 IGNITION descriptive record"><rect width="1200" height="1350" fill="#f6f2e9"/><rect width="1200" height="128" fill="#ec6278"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="64" y="46" font-size="16">PROJECT 100 / DESCRIPTIVE VECTOR RECORD / 5 OCTOBER 2026</text><text x="64" y="96" font-size="36" font-weight="700">V1 IGNITION</text><text x="64" y="180" font-size="18" font-weight="700" fill="#534b42">DEPLOYMENT</text><text x="64" y="214" font-size="22" fill="#242424">Morning training only (State A)</text><text x="64" y="274" font-size="18" font-weight="700" fill="#534b42">BASE</text><text x="64" y="308" font-size="22" fill="#242424">500-600 mL cold filtered water</text><text x="64" y="368" font-size="18" font-weight="700" fill="#534b42">INGREDIENTS</text><text x="64" y="402" font-size="22" fill="#242424">ALLMAX Impact Igniter Xtreme 2.0 (2 scoops / 28 g); ALLMAX MuscleEAA Xtreme (1 scoop</text><text x="64" y="434" font-size="22" fill="#242424">/ 17.73 g); PeakO2 2,000 mg; Betaine Anhydrous 2,500 mg; Citrulline Malate 2:1 (4-6</text><text x="64" y="466" font-size="22" fill="#242424">g); Pure Taurine Powder (2-3 g). Citicoline 250 mg capsule taken separately.</text><text x="64" y="526" font-size="18" font-weight="700" fill="#534b42">PROTOCOL</text><text x="64" y="560" font-size="22" fill="#242424">06:00 pre- gym; morning training only</text><text x="64" y="620" font-size="18" font-weight="700" fill="#534b42">MECHANISM</text><text x="64" y="654" font-size="22" fill="#242424">About 373 mg total caffeine, 10.67-12 g active citrulline base, 3.2 g beta-alanine,</text><text x="64" y="686" font-size="22" fill="#242424">2 g PeakO2 mushrooms, 2.5 g betaine. Spaced about 2 hours post- breakfast tea.</text><text x="64" y="746" font-size="18" font-weight="700" fill="#534b42">STACK INTERACTION</text><text x="64" y="780" font-size="22" fill="#242424">IGNITER about 373 mg caffeine + TeaCrine (theacrine half-life 16-20 h) + Dynamine +</text><text x="64" y="812" font-size="22" fill="#242424">theobromine + Earl Grey 40-70 mg — Exposure regularly crosses the 400 mg/day</text><text x="64" y="844" font-size="22" fill="#242424">guidance; sleep is the limiting organ.</text><text x="64" y="904" font-size="18" font-weight="700" fill="#534b42">MARGIN</text><text x="64" y="938" font-size="22" fill="#242424">IGNITER about 373 mg caffeine before tea; with tea about 413–443 mg versus Health</text><text x="64" y="970" font-size="22" fill="#242424">Canada 400 mg/day guidance.</text><text x="64" y="1030" font-size="18" font-weight="700" fill="#534b42">MONITOR</text><text x="64" y="1064" font-size="22" fill="#242424">Sleep duration and awakenings; session RPE and performance.</text><text x="64" y="1124" font-size="18" font-weight="700" fill="#534b42">STOP RULE</text><text x="64" y="1158" font-size="22" fill="#242424">Palpitations, fainting or sleep disruption that does not resolve when caffeine is</text><text x="64" y="1190" font-size="22" fill="#242424">pulled earlier.</text><text x="64" y="1270" font-size="16">Personal system record; not a safety guarantee or prescription.</text><text x="64" y="1298" font-size="16">project100.fit/fit-protocol-vector-v1.html</text></g></svg>