<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1216" viewBox="0 0 1200 1216" role="img" aria-label="V4 RELOAD ingredients and protocol"><rect width="1200" height="1216" fill="#f6f2e9"/><rect width="1200" height="128" fill="#f06778"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="64" y="46" font-size="16" fill="#242424">PROJECT 100 / DESCRIPTIVE VECTOR RECORD / V2.0</text><text x="64" y="96" font-size="36" font-weight="700" fill="#151515">V4 RELOAD</text><text x="64" y="188" font-size="18" font-weight="700" fill="#534b42">BASE</text><text x="64" y="222" font-size="22" fill="#242424">350-450 mL room-temperature water</text><text x="64" y="284" font-size="18" font-weight="700" fill="#534b42">INGREDIENTS</text><text x="64" y="318" font-size="22" fill="#242424">BioSteel Recovery Protein Plus (1 scoop / 36 g half-serving); Rootalive Beetroot Powder</text><text x="64" y="350" font-size="22" fill="#242424">7 g raw; Proline Pure Creatine HCl 750 mg active; Kirkland Himalayan Salt 1/16 tsp</text><text x="64" y="412" font-size="18" font-weight="700" fill="#534b42">PROTOCOL</text><text x="64" y="446" font-size="22" fill="#242424">11:00 post- workout; training only. Preceded by whole R-ALA 300 mg with water</text><text x="64" y="508" font-size="18" font-weight="700" fill="#534b42">MECHANISM</text><text x="64" y="542" font-size="22" fill="#242424">Scaled half-serving: 12 g protein, 19 g carbohydrate, 125 kcal. Dietary nitrates from</text><text x="64" y="574" font-size="22" fill="#242424">beetroot combine with creatine HCl. R-ALA swallowed whole; emptying into the shake risks</text><text x="64" y="606" font-size="22" fill="#242424">mucosal irritation and degradation.</text><text x="64" y="668" font-size="18" font-weight="700" fill="#534b42">STACK INTERACTION</text><text x="64" y="702" font-size="22" fill="#242424">R-ALA 300 mg + glycogen- depleted training + only 19 g carbohydrate in V4 —</text><text x="64" y="734" font-size="22" fill="#242424">Hypoglycaemia symptoms post- training need glucose awareness, not stimulant escalation.</text><text x="64" y="796" font-size="18" font-weight="700" fill="#534b42">MARGIN</text><text x="64" y="830" font-size="22" fill="#242424">R-ALA 300 mg training days; no UL established. V4 is one 36 g half-serving, with 19 g</text><text x="64" y="862" font-size="22" fill="#242424">carbohydrate.</text><text x="64" y="924" font-size="18" font-weight="700" fill="#534b42">MONITOR</text><text x="64" y="958" font-size="22" fill="#242424">Recurrent sweating, tremor or confusion after training.</text><text x="64" y="1020" font-size="18" font-weight="700" fill="#534b42">STOP RULE</text><text x="64" y="1054" font-size="22" fill="#242424">Recurrent sweating, tremor or confusion after training: stop and seek assessment.</text><text x="64" y="1136" font-size="16" fill="#534b42">Personal system record. Read the source before adopting a protocol.</text><text x="64" y="1164" font-size="16" fill="#534b42">project100.fit/guidebook.html#vector-v4</text></g></svg>