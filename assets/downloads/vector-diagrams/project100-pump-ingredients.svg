<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1184" viewBox="0 0 1200 1184" role="img" aria-label="PUMP EVENING ingredients and protocol"><rect width="1200" height="1184" fill="#f6f2e9"/><rect width="1200" height="128" fill="#799bd6"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="64" y="46" font-size="16" fill="#242424">PROJECT 100 / DESCRIPTIVE VECTOR RECORD / V2.0</text><text x="64" y="96" font-size="36" font-weight="700" fill="#151515">PUMP EVENING</text><text x="64" y="188" font-size="18" font-weight="700" fill="#534b42">BASE</text><text x="64" y="222" font-size="22" fill="#242424">500-600 mL cold water</text><text x="64" y="284" font-size="18" font-weight="700" fill="#534b42">INGREDIENTS</text><text x="64" y="318" font-size="22" fill="#242424">ALLMAX Impact Pump Xtreme (2 scoops / 31 g); MuscleEAA Xtreme (1 scoop); PeakO2 2,000</text><text x="64" y="350" font-size="22" fill="#242424">mg; Betaine 2,500 mg; Citrulline Malate 2:1 (4-6 g); Taurine 2-3 g; Citicoline 250 mg</text><text x="64" y="412" font-size="18" font-weight="700" fill="#534b42">PROTOCOL</text><text x="64" y="446" font-size="22" fill="#242424">Inactive. Never used with V1</text><text x="64" y="508" font-size="18" font-weight="700" fill="#534b42">MECHANISM</text><text x="64" y="542" font-size="22" fill="#242424">Preserved strictly for structural reference. Non-stimulant evening alternative that must</text><text x="64" y="574" font-size="22" fill="#242424">never be co- administered with a morning stimulant session.</text><text x="64" y="636" font-size="18" font-weight="700" fill="#534b42">STACK INTERACTION</text><text x="64" y="670" font-size="22" fill="#242424">Citicoline 250 mg + Alpha-GPC 200 mg + choline salts + DMAE + multivitamin choline 57</text><text x="64" y="702" font-size="22" fill="#242424">mg, against Huperzine A 200 mcg — Excess cholinergic tone: bradycardia, fasciculations,</text><text x="64" y="734" font-size="22" fill="#242424">salivation, GI cramps that can mimic overtraining.</text><text x="64" y="796" font-size="18" font-weight="700" fill="#534b42">MARGIN</text><text x="64" y="830" font-size="22" fill="#242424">Inactive: never used with V1.</text><text x="64" y="892" font-size="18" font-weight="700" fill="#534b42">MONITOR</text><text x="64" y="926" font-size="22" fill="#242424">Branch selected correctly; morning stimulant session recorded.</text><text x="64" y="988" font-size="18" font-weight="700" fill="#534b42">STOP RULE</text><text x="64" y="1022" font-size="22" fill="#242424">Do not combine this inactive evening alternative with V1.</text><text x="64" y="1104" font-size="16" fill="#534b42">Personal system record. Read the source before adopting a protocol.</text><text x="64" y="1132" font-size="16" fill="#534b42">project100.fit/guidebook.html#vector-pump</text></g></svg>